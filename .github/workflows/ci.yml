name: Python CI

# Trigger this workflow on every push or pull request to your CI branch or main
on:
  push:
    branches: [ "main", "master", "develop", "chore/ci-and-lint" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down your repository code
    - uses: actions/checkout@v4

    # 2. Set up Python 3.10 to match your local environment
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    # 3. Install dependencies (Pydantic, Ruff, etc.)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pydantic ruff

    # 4. Run the linter to catch style/syntax issues
    - name: Lint with Ruff
      run: ruff check .

    # 5. Run your unit test suite automatically
    - name: Run Unit Tests
      run: |
        python -m unittest discover -s . -p "test_*.py"